[package]
name = "wpi"
version = "1.6.0"
description = "Windows Program Inventory — Tauri + Rust"
edition = "2021"
rust-version = "1.77"

[lib]
name = "wpi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
chrono = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
